<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Fourth Wave Coffee</title>
  <meta name="description" content="Write to AppChurch Global Foundation about Fourth Wave Coffee, Legacy 1892, or American Smile. We do not publish an email address on this page.">
  <link rel="canonical" href="https://fourthwavecoffee.org/contact.html">
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="Contact | Fourth Wave Coffee">
  <meta property="og:url" content="https://fourthwavecoffee.org/contact.html">
  <meta property="og:description" content="Write to AppChurch Global Foundation about Fourth Wave Coffee. We do not publish an email address on this page.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div data-nav></div>
  <header class="page-hero wrap">
    <h1>Write to us.</h1>
  </header>
  <main class="wrap">
    <form class="form" id="contact-form" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" maxlength="80" autocomplete="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" maxlength="120" autocomplete="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" maxlength="400" required></textarea>
      <div class="hp" aria-hidden="true">
        <label>Company</label>
        <input type="text" name="company" tabindex="-1" autocomplete="off">
      </div>
      <button class="btn" type="submit">Send</button>
      <p class="form-note" id="contact-status">We read every note. Please do not include passwords, medical records, or payment numbers.</p>
    </form>
  </main>
  <footer data-footer></footer>
  <script src="site.js"></script>
</body>
</html>
