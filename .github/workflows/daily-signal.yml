name: Daily signal scan

on:
  schedule:
    # 8:15 AM America/Los_Angeles so the packet is on Pages by 9 AM Pacific
    # PDT (UTC-7) = 15:15 UTC · PST (UTC-8) = 16:15 UTC
    - cron: "15 15 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run only at 8 AM Pacific (scheduled)
        id: gate
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          print("Pacific now:", now.isoformat())
          skip = "0"
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and now.hour != 8:
              print("Not 8 AM Pacific — skip")
              skip = "1"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("skip=" + skip + "\n")
          PY
      - name: Crawl coffee feeds and write editorial draft
        if: steps.gate.outputs.skip != '1'
        run: python3 scripts/crawl-signals.py --once-a-day
      - name: Commit and push if changed
        if: steps.gate.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json signals.data.js data/archive.json data/editorial-draft.json editorial.draft.js
          if git diff --cached --quiet; then
            echo "No signal or draft changes"
            exit 0
          fi
          git commit -m "Daily signal + editorial draft $(TZ=America/Los_Angeles date +%Y-%m-%d) (Pacific morning packet)"
          git pull --rebase origin main || true
          git push origin HEAD:main
