name: Daily signal scan

on:
  schedule:
    # 8:15 AM America/Los_Angeles. GitHub cron is often hours late, so
    # extra slots still fire; the job skips only if already scanned today.
    # PDT (UTC-7) = 15:15 UTC · PST (UTC-8) = 16:15 UTC
    - cron: "15 15 * * *"
    - cron: "15 16 * * *"
    - cron: "30 18 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl coffee feeds, covers, and CoC-shaped editorial outline
        run: python3 scripts/crawl-signals.py --once-a-day
      - name: Commit and push if changed
        # Latest Beat cards auto-publish (signals.data.js). Live editorial prose does not.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json signals.data.js data/archive.json data/editorial-draft.json editorial.draft.js
          if git diff --cached --quiet; then
            echo "No signal or draft changes"
            exit 0
          fi
          git commit -m "Daily signal + editorial draft $(TZ=America/Los_Angeles date +%Y-%m-%d) (Pacific morning packet)"
          git pull --rebase origin main || true
          git push origin HEAD:main
